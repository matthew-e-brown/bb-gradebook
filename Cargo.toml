[package]
name = "bb-gradebook"
description = "Neatly extracts student submissions from zip files downloaded from Blackboard."
authors = ["Matthew Brown <matthew.e.brown.17@gmail.com>"]
version = "0.1.2"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
zip = "7.1.0"
regex = "1.12.2"
chrono = "0.4.43"
thiserror = "2.0.17"
clap = { version = "4.5.54", features = ["derive", "wrap_help"] }
