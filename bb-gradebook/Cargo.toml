[package]
name = "bb-gradebook"
description = "A library for working with \"gradebook\" zip files downloaded from Blackboard."
authors = ["Matthew Brown <matthew.e.brown.17@gmail.com>"]
version = "0.2.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
zip = "7.1.0"
regex = "1.12.2"
chrono = "0.4.43"
thiserror = "2.0.17"
smallvec = "1.15.1"
hashbrown = { version = "0.16.1", default-features = false, features = ["inline-more"]}
